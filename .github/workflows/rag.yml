name: rag
on:
  push:
    paths: ["rag/**", "tests/rag/**", ".github/workflows/rag.yml"]
  pull_request:
    paths: ["rag/**", "tests/rag/**", ".github/workflows/rag.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/rag -v
      - run: python rag/ingest.py --stats
